<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaLens</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body>

    <!-- Header with Navigation -->
    <div id="header"></div>

    <!-- Spacing Content Area -->
    <main style="min-height: 500px;"></main>

    <!-- Video Background (placeholder example)-->
    <video autoplay muted loop id="bg-video">
      <source src="videos/water-background.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Footer -->
    <div id="footer"></div>

</body>

<script>
  // Special class to the body so the header knows it's the homepage
  document.body.classList.add('home');
  // Fetch header and footer HTML
  fetch('/assets/header.html')
    .then(res => res.text())
    .then(html => document.getElementById('header').innerHTML = html);

  fetch('/assets/footer.html')
    .then(res => res.text())
    .then(html => document.getElementById('footer').innerHTML = html);
</script>

</html>
