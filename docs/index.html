<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaLens</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body>

    <!-- Header with Navigation -->
    <header>
      <div class="container header-content">
        <div class="logo">
          <a href="">
            <img src="images/Logo.png" alt="AquaLens" />
          </a>
        </div>
        <nav>
          <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="projects">Projects</a></li>
            <li><a href="data">Data</a></li>
            <li><a href="about">About</a></li>
            <li><a href="https://www.linkedin.com/groups/13190462/" target="_blank">Community</a></li>
            <li><a href="froggy"><img src="images/Froggy 3.png" alt="AI agent" class="nav-icon"></a></li>
          </ul>
        </nav>
      </div>
    </header>
    <div id="header"></div>

    <!-- Spacing Content Area (placeholder)-->
    <main style="min-height: 700px;"></main>

    <!-- Video Background (placeholder example)-->
    <video autoplay muted loop id="bg-video">
      <source src="videos/water-background.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Footer -->
    <div id="footer"></div>

</body>

<script>
  // Special class to the body so the header knows it's the homepage
  document.body.classList.add('home');
  // Fetch header and footer HTML
  fetch('/assets/header.html')
    .then(res => res.text())
    .then(html => document.getElementById('header').innerHTML = html);

  fetch('/assets/footer.html')
    .then(res => res.text())
    .then(html => document.getElementById('footer').innerHTML = html);
</script>

</html>
