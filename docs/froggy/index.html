<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaLens</title>
  <link rel="stylesheet" href="froggy.css" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body>

  
    <!-- Header with Navigation -->
    <div id="header"></div>

<!-- Froggy Chat (Always Visible) -->
<div class="froggy-chat-popup" id="froggy-popup">
  <div class="froggy-chat-header">
    <span>Froggy</span>
    <button id="froggy-close" class="froggy-close">&times;</button>
  </div>
  <div class="froggy-chat-messages" id="froggy-messages"></div>
  <div class="froggy-chat-input">
    <textarea id="froggy-question" placeholder="Type a message..."></textarea>
    <button id="froggy-send">➤</button>
  </div>
</div>
      </aside>
  <!-- Footer -->
  <div id="footer"></div>
</body>

<script>
  // Fetch header and footer HTML
  fetch('/assets/header.html')
    .then(res => res.text())
    .then(html => document.getElementById('header').innerHTML = html);

  fetch('/assets/footer.html')
    .then(res => res.text())
    .then(html => document.getElementById('footer').innerHTML = html);

// Froggy chat
document.addEventListener('DOMContentLoaded', () => {
  // Elements
  const froggyBtn = document.getElementById('froggy-button');
  const froggyPopup = document.getElementById('froggy-popup');
  const froggyClose = document.getElementById('froggy-close');
  const sendBtn = document.getElementById('froggy-send');
  const textarea = document.getElementById('froggy-question');
  const messages = document.getElementById('froggy-messages');
  
  // Add the reset button to the header immediately
  const header = document.querySelector('.froggy-chat-header');
  if (header) {
    // Create reset button
    const resetBtn = document.createElement('button');
    resetBtn.id = 'froggy-reset';
    resetBtn.className = 'froggy-reset-button';
    resetBtn.textContent = 'New Chat';
    resetBtn.addEventListener('click', resetConversation);
    
    // Create container for header buttons
    const headerButtons = document.createElement('div');
    headerButtons.className = 'froggy-header-buttons';
    
    // Clone the close button (we'll remove the original)
    const newCloseBtn = froggyClose.cloneNode(true);
    newCloseBtn.addEventListener('click', () => {
      froggyPopup.style.display = 'none';
    });
    
    // Add buttons to container
    headerButtons.appendChild(resetBtn);
    headerButtons.appendChild(newCloseBtn);
    
    // Remove the original close button if it exists
    if (froggyClose.parentNode) {
      froggyClose.parentNode.removeChild(froggyClose);
    }
    
    // Add container to header
    header.appendChild(headerButtons);
  }
  
  // Configuration
  const USER_MESSAGE_CLASS = 'froggy-message froggy-user';
  const AI_MESSAGE_CLASS = 'froggy-message froggy-froggy';
  
  // Initialize conversation tracking
  window.froggyConversationContext = {
    sessionIds: [],
    messages: []
  };
  
  // Initialize session ID from localStorage if available
  window.sessionId = localStorage.getItem('froggy_session_id') || null;
  
  // If we have a session ID, add it to our tracking
  if (window.sessionId) {
    window.froggyConversationContext.sessionIds.push(window.sessionId);
  }
  
  // UI setup
  froggyBtn.addEventListener('click', () => {
    froggyPopup.style.display = 'flex';
  });
  
  sendBtn.addEventListener('click', handleSendMessage);
  
  textarea.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });
  
  // Check if conversation is empty and add welcome message if needed
  if (messages && messages.children.length === 0) {
    addMessageToConversation('Hello! I\'m Froggy, your guide to water quality initiatives and research. How can I help you today?', 'ai');
  }
  
  // Main function to handle sending messages
  async function handleSendMessage() {
    const text = textarea.value.trim();
    if (!text) return;
    
    // Clear input field
    textarea.value = '';
    
    // Add user message to conversation
    addMessageToConversation(text, 'user');
    
    // Store message in context
    window.froggyConversationContext.messages.push({
      role: 'user',
      content: text,
      timestamp: new Date().toISOString()
    });
    
    // Add typing indicator
    const typingMsgId = 'typing-msg-' + Date.now();
    addTypingIndicator(typingMsgId);
    
    // Scroll to bottom of conversation
    messages.scrollTop = messages.scrollHeight;
    
    try {
      // Send request to backend with all known session IDs
      const response = await fetch('https://aqualens-froggy-backend.hf.space/api/ask', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        mode: 'cors',
        credentials: 'omit',
        body: JSON.stringify({
          question: text,
          session_id: window.sessionId,
          previous_sessions: window.froggyConversationContext.sessionIds,
          message_history: window.froggyConversationContext.messages.slice(-5)
        })
      });
      
      // Remove typing indicator
      const typingMsg = document.getElementById(typingMsgId);
      if (typingMsg) {
        messages.removeChild(typingMsg);
      }
      
      if (!response.ok) {
        throw new Error(`API request failed with status ${response.status}`);
      }
      
      const data = await response.json();
      
      // Save session ID if provided
      if (data.session_id) {
        // Add to session ID history
        window.froggyConversationContext.sessionIds.push(data.session_id);
        
        // Update current session ID
        window.sessionId = data.session_id;
        localStorage.setItem('froggy_session_id', data.session_id);
      } else if (!window.sessionId && data.id) {
        // Fallback if session_id is not provided but id is
        window.froggyConversationContext.sessionIds.push(data.id);
        window.sessionId = data.id;
        localStorage.setItem('froggy_session_id', data.id);
      }
      
      const froggyResponse = data.answer || 'Sorry, I couldn\'t find an answer to that question.';
      
      // Add AI response to conversation
      addMessageToConversation(froggyResponse, 'ai');
      
      // Store AI response in context
      window.froggyConversationContext.messages.push({
        role: 'assistant',
        content: froggyResponse,
        timestamp: new Date().toISOString()
      });
      
      // Scroll to bottom of conversation
      messages.scrollTop = messages.scrollHeight;
      
    } catch (error) {
      console.error('Error details:', error);
      
      // Remove typing indicator if it still exists
      const typingMsg = document.getElementById(typingMsgId);
      if (typingMsg) {
        messages.removeChild(typingMsg);
      }
      
      addMessageToConversation('Sorry, there was an error connecting to my brain. Please try again later.', 'ai');
      messages.scrollTop = messages.scrollHeight;
    }
  }
  
  // Function to add messages with markdown support
  function addMessageToConversation(message, sender) {
    const messageElement = document.createElement('div');
    messageElement.className = sender === 'user' ? USER_MESSAGE_CLASS : AI_MESSAGE_CLASS;
    
    // Add message content with markdown parsing for AI responses
    if (sender === 'ai') {
      // Parse markdown (basic implementation)
      let formattedMessage = message
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
        .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
        .replace(/\n\n/g, '<br><br>') // Paragraphs
        .replace(/\n/g, '<br>'); // Line breaks
      
      messageElement.innerHTML = formattedMessage;
    } else {
      messageElement.textContent = message;
    }
    
    // Add timestamp
    const timestampElement = document.createElement('div');
    timestampElement.className = 'froggy-timestamp';
    const now = new Date();
    timestampElement.textContent = now.toLocaleTimeString();
    messageElement.appendChild(timestampElement);
    
    // Add to container
    messages.appendChild(messageElement);
  }
  
  // Function to add typing indicator
  function addTypingIndicator(id) {
    const msg = document.createElement('div');
    msg.id = id;
    msg.className = 'froggy-message froggy-froggy froggy-typing';
    msg.innerHTML = '<span>Thinking</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
    messages.appendChild(msg);
  }
  
  // Function to reset the conversation
  function resetConversation() {
    // Clear conversation display
    if (messages) {
      messages.innerHTML = '';
    }
    
    // Reset conversation context
    window.froggyConversationContext = {
      sessionIds: [],
      messages: []
    };
    
    // Clear session ID
    window.sessionId = null;
    localStorage.removeItem('froggy_session_id');
    
    // API call to reset conversation on backend
    fetch('https://aqualens-froggy-backend.hf.space/api/reset_conversation', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      mode: 'cors',
      credentials: 'omit',
      body: JSON.stringify({})
    })
    .then(response => response.json())
    .then(data => {
      console.log('Conversation reset:', data);
      
      // Add welcome message
      const welcomeMessage = 'Hello! I\'m Froggy, your guide to water quality initiatives and research. How can I help you today?';
      addMessageToConversation(welcomeMessage, 'ai');
      
      // Store welcome message in context
      window.froggyConversationContext.messages.push({
        role: 'assistant',
        content: welcomeMessage,
        timestamp: new Date().toISOString()
      });
      
      // If reset gives us a new session ID, store it
      if (data && data.session_id) {
        window.sessionId = data.session_id;
        window.froggyConversationContext.sessionIds.push(data.session_id);
        localStorage.setItem('froggy_session_id', data.session_id);
      }
    })
    .catch(error => {
      console.error('Error resetting conversation:', error);
      // Add welcome message anyway
      const welcomeMessage = 'Hello! I\'m Froggy, your guide to water quality initiatives and research. How can I help you today?';
      addMessageToConversation(welcomeMessage, 'ai');
      
      // Store welcome message in context
      window.froggyConversationContext.messages.push({
        role: 'assistant',
        content: welcomeMessage,
        timestamp: new Date().toISOString()
      });
    });
  }

  // Expose resetConversation globally so it can be called from other components if needed
  window.resetConversation = resetConversation;
});
</script>

</html>
