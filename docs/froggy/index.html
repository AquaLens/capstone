<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaLens</title>
  <link rel="stylesheet" href="froggy.css" />
  <link rel="stylesheet" href="/css/global.css" />
</head>

<body>

  
    <!-- Header with Navigation -->
    <div id="header"></div>

<!-- Froggy Chat (Always Visible) -->
<div class="froggy-chat-popup" id="froggy-popup">
  <div class="froggy-chat-header">
    <span>Froggy</span>
    <button id="froggy-close" class="froggy-close">&times;</button>
  </div>
  <div class="froggy-chat-messages" id="froggy-messages"></div>
  <div class="froggy-chat-input">
    <textarea id="froggy-question" placeholder="Type a message..."></textarea>
    <button id="froggy-send">➤</button>
  </div>
</div>
      </aside>
  <!-- Footer -->
  <div id="footer"></div>
</body>

<script>
  // Fetch header and footer HTML
  fetch('/assets/header.html')
    .then(res => res.text())
    .then(html => document.getElementById('header').innerHTML = html);

  fetch('/assets/footer.html')
    .then(res => res.text())
    .then(html => document.getElementById('footer').innerHTML = html);

// Froggy chat
     document.addEventListener('DOMContentLoaded', () => {
      const froggyBtn = document.getElementById('froggy-button');
      const froggyPopup = document.getElementById('froggy-popup');
      const froggyClose = document.getElementById('froggy-close');
      const sendBtn = document.getElementById('froggy-send');
      const textarea = document.getElementById('froggy-question');
      const messages = document.getElementById('froggy-messages');
      
      // Show initial welcome message
      const initialMessage = document.createElement('div');
      initialMessage.className = 'froggy-message froggy-froggy';
      initialMessage.textContent = 'Hi! I\'m Froggy, your water research assistant. Ask me anything about water quality research!';
      messages.appendChild(initialMessage);
      
      froggyBtn.addEventListener('click', () => {
        froggyPopup.style.display = 'flex';
      });
      
      froggyClose.addEventListener('click', () => {
        froggyPopup.style.display = 'none';
      });
      
      sendBtn.addEventListener('click', sendMessage);
      
      textarea.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      
      async function sendMessage() {
        const text = textarea.value.trim();
        if (!text) return;
        
        addMessage(text, 'user');
        textarea.value = '';
        
        // Add a temporary "typing" message
        const typingMsgId = 'typing-msg-' + Date.now();
        addTypingIndicator(typingMsgId);
        messages.scrollTop = messages.scrollHeight;
        
        try {
          // Send the user's question to the Render-hosted Flask API with improved error handling
          const response = await fetch('https://capstone-tutj.onrender.com/api/ask', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            mode: 'cors', // Explicitly set CORS mode
            credentials: 'omit', // Don't send cookies to avoid additional CORS complications
            body: JSON.stringify({ question: text }),
          });
          
          // Remove the typing indicator
          const typingMsg = document.getElementById(typingMsgId);
          if (typingMsg) {
            messages.removeChild(typingMsg);
          }
          
          if (!response.ok) {
            console.error('API error:', response.status, response.statusText);
            throw new Error(`API request failed with status ${response.status}`);
          }
          
          const data = await response.json();
          const froggyResponse = data.answer || 'Sorry, I couldn\'t find an answer to that question.';
          
          // Add the response from Froggy
          addMessage(froggyResponse, 'froggy');
          messages.scrollTop = messages.scrollHeight;
        } catch (error) {
          console.error('Error details:', error);
          
          // Remove the typing indicator if it still exists
          const typingMsg = document.getElementById(typingMsgId);
          if (typingMsg) {
            messages.removeChild(typingMsg);
          }
          
          addMessage('Sorry, there was an error connecting to my brain. Please try again later or check the console for details.', 'froggy');
          messages.scrollTop = messages.scrollHeight;
        }
      }
      
      function addMessage(content, sender) {
        const msg = document.createElement('div');
        msg.className = `froggy-message froggy-${sender}`;
        msg.textContent = content;
        messages.appendChild(msg);
      }
      
      function addTypingIndicator(id) {
        const msg = document.createElement('div');
        msg.id = id;
        msg.className = 'froggy-message froggy-froggy froggy-typing';
        msg.innerHTML = '<span>Thinking</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
        messages.appendChild(msg);
      }
    });
</script>

</html>
